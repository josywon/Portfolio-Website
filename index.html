<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Joseph Won</title>
  <meta name="description" content="Joseph Won — mechanical engineering student. Projects, CAD models and design work.">
  <meta name="theme-color" content="#fafafa">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://josephwon.dev/">
  <meta property="og:title" content="Joseph Won — Mechanical Engineer">
  <meta property="og:description" content="Mechanical engineering student. Projects, CAD models and design work.">
  <script>try { var t = localStorage.getItem('theme'); if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark'; if (sessionStorage.getItem('portal')) { document.documentElement.classList.add('portal-in'); setTimeout(function () { document.documentElement.classList.remove('portal-in'); }, 6000); } } catch (e) {}</script>
  <style>html.portal-in body::after { content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none; background: #1a74ff; clip-path: circle(150vmax at var(--px, 50%) var(--py, 50%)); transition: clip-path .7s cubic-bezier(.6, 0, .2, 1); } html.portal-out body::after { clip-path: circle(0 at var(--px, 50%) var(--py, 50%)); }</style>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%231a74ff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/simple.css">
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    } }
  </script>
</head>
<body>

  <main class="grid" id="grid">
    <!-- left column: who I am, the selected project, its model -->
    <header class="who">
      <h1>joseph won<button class="egg" id="egg" aria-label="Open the full 3D version of this site" title="?">.</button></h1>
      <p class="role">
        <span>Mechanical Engineering, University of Waterloo</span>
        <button class="contact-btn" id="contact-btn" aria-haspopup="dialog">Contact</button>
      </p>
    </header>

    <section class="pane text" id="text" aria-live="polite"></section>

    <section class="pane model" aria-label="3D model">
      <div class="stage" id="stage">
        <canvas id="gl" aria-label="3D model of the selected project. Drag to rotate, scroll to zoom."></canvas>
        <div class="variants" id="variants" role="tablist" aria-label="Model"></div>
        <p class="stage-label">drag to rotate</p>
        <p class="stage-note" id="note"></p>
        <p class="stage-load" id="load">loading model…</p>
      </div>
      <div class="skills" id="skills" hidden></div>
    </section>

    <!-- right column: project tabs over the photos -->
    <nav class="bar" aria-label="Projects">
      <div class="tabs" id="tabs"></div>
      <div class="step">
        <button id="prev" aria-label="Previous project">‹</button>
        <span id="count"></span>
        <button id="next" aria-label="Next project">›</button>
      </div>
      <button class="theme" id="theme" aria-label="Dark mode" aria-pressed="false" title="Light / dark">
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.2 8.2 0 1 0 10.2 10.2z"/></svg>
      </button>
    </nav>

    <section class="pane side" id="side"></section>
  </main>

  <dialog class="lb" id="lb" aria-label="Enlarged image">
    <figure>
      <img id="lb-img" alt="">
      <video id="lb-video" controls muted playsinline preload="metadata" hidden></video>
      <figcaption>
        <span id="lb-cap"></span>
        <span class="lb-count" id="lb-count"></span>
      </figcaption>
    </figure>
    <div class="lb-nav">
      <button id="lb-prev" aria-label="Previous image">←</button>
      <span>
        <a id="lb-pdf" target="_blank" rel="noopener" hidden>Open PDF ↗</a>
        <button id="lb-close" aria-label="Close">close</button>
      </span>
      <button id="lb-next" aria-label="Next image">→</button>
    </div>
  </dialog>


  <dialog class="contact-dlg" id="contact-dlg" aria-labelledby="contact-title">
    <h2 id="contact-title">Contact</h2>
    <div class="contact-links">
      <a class="c-link" id="c-email"><svg viewBox="0 0 24 24" aria-hidden="true" class="line"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M4 8l8 6 8-6"/></svg><span class="t">Email</span><span class="s" id="c-email-addr"></span></a>
      <a class="c-link" id="c-linkedin" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6.2" cy="6.4" r="1.9"/><rect x="4.6" y="10" width="3.2" height="9.4" rx=".6"/><path d="M10.4 10.6c0-.33.27-.6.6-.6h2c.33 0 .6.27.6.6v.75c.6-.95 1.7-1.6 3.1-1.6 2.5 0 3.7 1.6 3.7 4.3v4.75c0 .33-.27.6-.6.6h-2c-.33 0-.6-.27-.6-.6v-4.3c0-1.2-.5-1.9-1.5-1.9-1.1 0-1.9.8-1.9 2.2v4c0 .33-.27.6-.6.6h-2.2a.6.6 0 0 1-.6-.6z"/></svg><span class="t">LinkedIn</span><span class="s">josephwon119</span></a>
      <a class="c-link" id="c-github" target="_blank" rel="noopener"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg><span class="t">GitHub</span><span class="s">josywon</span></a>
    </div>
    <p class="c-copy"><button id="c-copy">Copy email address</button></p>
    <form method="dialog"><button class="c-close" aria-label="Close">close</button></form>
  </dialog>

  <script type="module" src="js/simple.js"></script>
</body>
</html>
